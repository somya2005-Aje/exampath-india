# ExamPath India — build debug APK on GitHub Actions (free tier).
#
# Runs on every push to main and on manual dispatch (Actions tab -> Run workflow).
# The APK is uploaded as a build artifact (download from the Actions run page).
# No repository secrets are needed for a debug build.
#
# For a signed RELEASE build later: generate a keystore, add it as secrets
# (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS), restore it before the
# build step, and run `./gradlew assembleRelease` instead — see the
# voiceworld-ai workflow for the proven pattern.

name: Build ExamPath India debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # The ubuntu runner already ships an Android SDK (ANDROID_HOME). Install
        # exactly the packages the build needs; do NOT use
        # android-actions/setup-android — its default `tools` package no longer
        # exists in the SDK repository and fails the run.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: cd android-app && npm ci

      - name: Prepare web assets (copy final-deploy into www)
        run: bash android-app/scripts/prepare-www.sh

      - name: Sync Capacitor
        run: cd android-app && npx cap sync android

      - name: Build debug APK
        run: cd android-app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exampath-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
